function Pill({children,color,small}){return <span style={{background:color+"22",color,border:`1px solid ${color}44`,borderRadius:20,padding:small?"2px 8px":"3px 12px",fontSize:small?10:12,fontWeight:700,whiteSpace:"nowrap"}}>{children}</span>;}
function Btn({children,onClick,color=C.gold,outline,full,disabled,small}){return <button onClick={onClick} disabled={disabled} style={{width:full?"100%":"auto",background:outline?"transparent":disabled?C.border:color,color:outline?color:disabled?C.muted:color===C.gold?"#000":"#fff",border:`2px solid ${disabled?C.border:color}`,borderRadius:small?10:14,padding:small?"7px 14px":"12px 20px",fontWeight:800,fontSize:small?12:15,cursor:disabled?"not-allowed":"pointer",fontFamily:"inherit"}}>{children}</button>;}
function Inp({label,value,onChange,type="text",placeholder}){return <div style={{marginBottom:14}}>{label&&<label style={{color:C.muted,fontSize:12,display:"block",marginBottom:5}}>{label}</label>}<input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,padding:"11px 16px",color:C.text,fontSize:14,boxSizing:"border-box",fontFamily:"inherit"}}/></div>;}
function Sel({label,value,onChange,options}){return <div style={{marginBottom:14}}>{label&&<label style={{color:C.muted,fontSize:12,display:"block",marginBottom:5}}>{label}</label>}<select value={value} onChange={e=>onChange(e.target.value)} style={{width:"100%",background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,padding:"11px 16px",color:C.text,fontSize:14,boxSizing:"border-box",fontFamily:"inherit"}}>{options.map(o=><option key={o.v||o} value={o.v||o}>{o.l||o}</option>)}</select></div>;}
function BottomNav({tabs,active,onChange,color=C.gold}){return <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:C.card,borderTop:`1px solid ${C.border}`,display:"flex",paddingBottom:4,zIndex:40}}>{tabs.map(({id,icon,label,badge})=>(<button key={id} onClick={()=>onChange(id)} style={{flex:1,background:"none",border:"none",padding:"8px 0 4px",color:active===id?color:C.muted,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:1,fontFamily:"inherit",position:"relative"}}><span style={{fontSize:18}}>{icon}</span><span style={{fontSize:8,fontWeight:active===id?800:400}}>{label}</span>{badge>0&&<div style={{position:"absolute",top:4,right:"18%",width:14,height:14,borderRadius:"50%",background:C.danger,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,color:"#fff",fontWeight:800}}>{badge}</div>}{active===id&&<div style={{width:16,height:2,background:color,borderRadius:1}}/>}</button>))}</div>;}

function ArcGauge({value,max,color,label,unit,size=88}){
  const pct=Math.min(value/max,1),r=32,cx=44,cy=44;
  const toRad=d=>d*Math.PI/180;
  const arc=(a1,a2)=>{const x1=cx+r*Math.cos(toRad(a1)),y1=cy+r*Math.sin(toRad(a1)),x2=cx+r*Math.cos(toRad(a2)),y2=cy+r*Math.sin(toRad(a2));return `M ${x1} ${y1} A ${r} ${r} 0 ${a2-a1>180?1:0} 1 ${x2} ${y2}`;};
  const startA=-210,endA=30,angle=startA+(endA-startA)*pct,nx=cx+(r-8)*Math.cos(toRad(angle)),ny=cy+(r-8)*Math.sin(toRad(angle));
  return <div style={{textAlign:"center"}}><svg width={size} height={size*.8} viewBox="0 0 88 70"><path d={arc(startA,endA)} fill="none" stroke={C.border} strokeWidth="7" strokeLinecap="round"/><path d={arc(startA,angle)} fill="none" stroke={color} strokeWidth="7" strokeLinecap="round" style={{transition:"all 1s"}}/><circle cx={nx} cy={ny} r="4" fill={color}/><text x={cx} y={cy+2} textAnchor="middle" fill={C.text} fontSize="13" fontWeight="800">{value}</text><text x={cx} y={cy+13} textAnchor="middle" fill={C.muted} fontSize="8">{unit}</text></svg><div style={{color:C.muted,fontSize:10,marginTop:-2}}>{label}</div></div>;
}
function ProgressRing({pct,color,size=56}){const stroke=6,r=(size-stroke*2)/2,circ=2*Math.PI*r,dash=pct/100*circ,mid=size/2;return <svg width={size} height={size}><circle cx={mid} cy={mid} r={r} fill="none" stroke={C.border} strokeWidth={stroke}/><circle cx={mid} cy={mid} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" transform={`rotate(-90 ${mid} ${mid})`} style={{transition:"stroke-dasharray 1s"}}/><text x={mid} y={mid+4} textAnchor="middle" fill={C.text} fontSize="12" fontWeight="800">{pct}%</text></svg>;}

function TireCard({tire}){
  const s=tireStatus(tire),color=sc(s),r=remDays(tire),p=usedPct(tire),wl=tire.warranty-tire.wUsed,pdiff=tire.pressure-tire.pressureIdeal;
  return <div style={{background:C.card,border:`1.5px solid ${s==="danger"?C.danger+"88":s==="warning"?C.gold+"66":C.border}`,borderRadius:18,padding:16,marginBottom:12}}>

function AIChat({title,icon,color,systemPrompt,suggestions,onClose,user}){
  const[msgs,setMsgs]=useState([{role:"assistant",text:`مرحباً ${user?.name||""}!\nأنا ${title} 🤖\nيمكنك إرسال نص أو صورة وأنا أحللها فوراً.`}]);
  const[input,setInput]=useState("");
  const[loading,setLoading]=useState(false);
  const[pendingImg,setPendingImg]=useState(null);
  const fileRef=useRef(),ref=useRef();
  useEffect(()=>{ref.current?.scrollIntoView({behavior:"smooth"});},[msgs,loading]);

  const onFile=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>setPendingImg({base64:reader.result.split(",")[1],preview:reader.result,mediaType:file.type||"image/jpeg"});reader.readAsDataURL(file);e.target.value="";};

  const send=async(text)=>{
    const msg=text||input.trim();if((!msg&&!pendingImg)||loading)return;
    setInput("");const img=pendingImg;setPendingImg(null);
    setMsgs(m=>[...m,{role:"user",text:msg||(img?"📸 صورة للتحليل":""),img:img?.preview}]);
    setLoading(true);
    try{
      const userContent=img?[{type:"image",source:{type:"base64",media_type:img.mediaType,data:img.base64}},{type:"text",text:msg||"حلّل هذه الصورة بالتفصيل"}]:msg;
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:900,system:systemPrompt,
          messages:[...msgs.slice(-6).map(m=>({role:m.role,content:m.text})),{role:"user",content:userContent}]})});
      const data=await res.json();
      setMsgs(m=>[...m,{role:"assistant",text:data.content?.map(c=>c.text||"").join("")||"عذراً."}]);
    }catch{setMsgs(m=>[...m,{role:"assistant",text:"خطأ في الاتصال."}]);}
    setLoading(false);
  };

  return <div style={{position:"fixed",inset:0,background:"#000d",display:"flex",flexDirection:"column",zIndex:300,maxWidth:480,margin:"0 auto"}}>
    <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={onFile} style={{display:"none"}}/>

      </div>
      <button onClick={onClose} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:8,width:30,height:30,color:C.dim,cursor:"pointer"}}>✕</button>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:12,display:"flex",flexDirection:"column",gap:10,background:C.bg}}>
      {msgs.map((m,i)=>(
        <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",flexDirection:"column",alignItems:m.role==="user"?"flex-end":"flex-start"}}>
          {m.img&&<img src={m.img} alt="" style={{width:160,height:120,objectFit:"cover",borderRadius:12,marginBottom:4}}/>}
          {m.text&&<div style={{background:m.role==="user"?color:C.card,color:m.role==="user"?color===C.gold?"#000":"#fff":C.text,borderRadius:"12px",padding:"10px 14px",maxWidth:"82%",fontSize:13,lineHeight:1.7,whiteSpace:"pre-wrap"}}>{m.text}</div>}
        </div>
      ))}
      {loading&&<div style={{display:"flex",gap:4,padding:8}}>{[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:"50%",background:color,animation:`bounce 1s infinite ${i*.2}s`}}/>)}</div>}
      <div ref={ref}/>
    </div>
    {pendingImg&&<div style={{padding:"6px 12px",background:C.card,display:"flex",gap:8,alignItems:"center"}}><img src={pendingImg.preview} alt="" style={{width:40,height:40,borderRadius:8,objectFit:"cover"}}/><span style={{color:C.text,fontSize:12,flex:1}}>صورة جاهزة</span><button onClick={()=>setPendingImg(null)} style={{background:"none",border:"none",color:C.danger,cursor:"pointer",fontSize:16}}>✕</button></div>}
    {msgs.length<3&&suggestions&&<div style={{padding:"6px 12px",background:C.bg,display:"flex",flexWrap:"wrap",gap:6}}>{suggestions.map(s=><button key={s} onClick={()=>send(s)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:"4px 10px",color:C.dim,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{s}</button>)}</div>}
    <div style={{padding:10,borderTop:`1px solid ${C.border}`,background:C.card,display:"flex",gap:8}}>

      ?{category:"tire",desc:`${newItem.brand} ${newItem.size} — ${newItem.axle}`,serial:newItem.serial,warranty:`${newItem.warranty} شهر`,axle:newItem.axle}
      :addCategory==="oil"
      ?{category:"oil",desc:`تغيير زيت${newItem.desc?" — "+newItem.desc:""}`,km:+newItem.km,warranty:null}
      :addCategory==="battery"
      ?{category:"battery",desc:`تغيير بطارية${newItem.desc?" — "+newItem.desc:""}`,warranty:newItem.warranty?`${newItem.warranty} شهر`:null}
      :{category:"maintenance",desc:newItem.desc||"صيانة عامة",warranty:null};
    setInvoices(i=>[{id:`INV-${Date.now()}`,date:todayStr(),seller:newItem.seller,...base,total,tax:Math.round(total*.15),photo:invPhoto?.preview||null,driverName:user.name,driverId:user.id},...i]);
    setNewItem({serial:"",brand:"Bridgestone",size:"11R22.5",axle:"أمامي توجيه",cost:"",warranty:"24",desc:"",seller:"",km:""});
    setInvPhoto(null);
    setShowAdd(false);
  };

  const tireInvoices=invoices.filter(i=>i.category==="tire");
  const oilInvoices=invoices.filter(i=>i.category==="oil");

  const tabs=[
    {id:"home",icon:"🏠",label:"الرئيسية",badge:urgentTires},
    {id:"truck",icon:"🚛",label:"شاحنتي"},
    {id:"invoices",icon:"📄",label:"السجلات"},
    {id:"profile",icon:"👤",label:"حسابي"},
  ];

  return <div>
    <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,background:C.card,position:"sticky",top:0,zIndex:50,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <div style={{width:34,height:34,borderRadius:10,background:C.blue+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{user.avatar}</div>
        <div><div style={{color:C.blue,fontWeight:900,fontSize:13}}>{user.name}</div><div style={{color:C.muted,fontSize:10}}>{user.truckBrand} • {user.truck}</div></div>
      </div>
      <div style={{display:"flex",gap:6}}>
        {urgentTires>0&&<Pill color={C.danger} small>⚠️{urgentTires}</Pill>}
        <button onClick={()=>setModal("nearby")} style={{background:C.danger+"22",border:`1px solid ${C.danger}44`,borderRadius:20,padding:"5px 10px",color:C.danger,fontSize:11,cursor:"pointer",fontWeight:800,fontFamily:"inherit"}}>🚨</button>
        <button onClick={()=>setModal("ai")} style={{background:C.teal+"22",border:`1px solid ${C.teal}44`,borderRadius:20,padding:"5px 8px",color:C.teal,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>🤖</button>
      </div>
    </div>

    <div style={{padding:14,paddingBottom:90}}>
      {/* ── HOME ── */}
      {tab==="home"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div onClick={()=>setModal("nearby")} style={{background:`linear-gradient(135deg,${C.danger},${C.danger}bb)`,borderRadius:16,padding:18,cursor:"pointer",display:"flex",gap:14,alignItems:"center",boxShadow:`0 4px 20px ${C.danger}44`}}>
          <div style={{fontSize:34}}>🚨</div>
          <div><div style={{color:"#fff",fontWeight:900,fontSize:16}}>زر الطوارئ</div><div style={{color:"rgba(255,255,255,.8)",fontSize:12,marginTop:2}}>أقرب ورشة ومورد فوراً</div></div>
        </div>
        {ld<90&&<div style={{background:(ld<30?C.danger:C.gold)+"12",border:`1.5px solid ${ld<30?C.danger:C.gold}44`,borderRadius:12,padding:12,display:"flex",gap:10,alignItems:"center"}}><span style={{fontSize:20}}>🪪</span><div><div style={{color:ld<30?C.danger:C.gold,fontWeight:700,fontSize:13}}>رخصة القيادة تنتهي خلال {ld} يوم</div><div style={{color:C.dim,fontSize:11}}>{user.licenseExpiry}</div></div></div>}
        {/* فحص اليوم */}
        <div style={{background:C.card,border:`1.5px solid ${todayChecked?C.success+"55":C.gold+"55"}`,borderRadius:16,padding:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div><div style={{color:C.text,fontWeight:800,fontSize:14}}>📋 فحص الشاحنة اليومي</div><div style={{color:C.muted,fontSize:11,marginTop:2}}>📷 الصور تُرسل لصاحب الأسطول</div></div>
            {todayChecked?<Pill color={C.success}>✅ {lastCheck.score}%</Pill>:<Pill color={C.gold}>⚠️ لم يُفحص</Pill>}
          </div>
          {todayChecked&&<div style={{background:C.success+"10",borderRadius:10,padding:10,marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between"}}><span style={{color:C.muted,fontSize:12}}>نسبة الفحص</span><span style={{color:C.success,fontWeight:700}}>{lastCheck.score}%</span></div>
            <div style={{background:C.border,borderRadius:99,height:5,marginTop:4}}><div style={{width:`${lastCheck.score}%`,height:"100%",background:C.success,borderRadius:99}}/></div>
            <div style={{color:C.dim,fontSize:11,marginTop:4}}>📷 {lastCheck.photos} صورة أُرسلت</div>
          </div>}
          <Btn full color={C.blue} onClick={()=>setModal("check")}>{todayChecked?"🔄 فحص جديد":"📋 ابدأ فحص اليوم"}</Btn>
        </div>
        {/* ملخص سريع */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div onClick={()=>setTab("truck")} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,cursor:"pointer",textAlign:"center"}}>
            <div style={{fontSize:24,marginBottom:4}}>🚛</div>
            <div style={{color:C.text,fontWeight:700,fontSize:13}}>شاحنتي</div>
            <div style={{color:C.muted,fontSize:10,marginTop:2}}>زيت • بطارية • تبريد</div>
          </div>
          <div onClick={()=>setTab("invoices")} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,cursor:"pointer",textAlign:"center"}}>
            <div style={{fontSize:24,marginBottom:4}}>📄</div>
            <div style={{color:C.text,fontWeight:700,fontSize:13}}>السجلات</div>
            <div style={{color:C.muted,fontSize:10,marginTop:2}}>كفرات • زيت • صيانة</div>
          </div>
        </div>
      </div>}

      {/* ── TRUCK ── */}
      {tab==="truck"&&<div>
        <div style={{color:C.text,fontWeight:800,fontSize:16,marginBottom:16}}>🚛 حالة شاحنتي</div>

        {/* الزيت */}
        <div style={{background:C.card,border:`1.5px solid ${oilPct>85?C.danger+"66":oilPct>70?C.gold+"66":C.border}`,borderRadius:16,padding:16,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <div style={{width:40,height:40,borderRadius:12,background:C.orange+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🛢️</div>
              <div><div style={{color:C.text,fontWeight:700,fontSize:14}}>زيت المحرك</div><div style={{color:C.muted,fontSize:11}}>آخر تغيير: {vitals.lastOilDate}</div></div>
            </div>
            <Pill color={oilPct>85?C.danger:oilPct>70?C.gold:C.success} small>{oilPct>85?"عاجل!":oilPct>70?"قريب":"جيد"}</Pill>
          </div>
          <div style={{background:C.border,borderRadius:99,height:8,marginBottom:8}}>
            <div style={{width:`${oilPct}%`,height:"100%",background:`linear-gradient(90deg,${C.success},${C.gold} 70%,${C.danger})`,borderRadius:99}}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            <div style={{background:C.card2,borderRadius:10,padding:10,textAlign:"center"}}>
              <div style={{color:C.muted,fontSize:10}}>الكيلومترات الحالية</div>
              <div style={{color:C.blue,fontWeight:800,fontSize:16,marginTop:2}}>{fmt(vitals.currentKm)} كم</div>
            </div>
            <div style={{background:C.card2,borderRadius:10,padding:10,textAlign:"center"}}>
              <div style={{color:C.muted,fontSize:10}}>متبقي للتغيير</div>
              <div style={{color:oilPct>85?C.danger:C.success,fontWeight:800,fontSize:16,marginTop:2}}>{fmt(oilRemKm)} كم</div>
            </div>
          </div>
          {/* تسجيل كيلومتر اليوم */}
          <div style={{background:C.card2,borderRadius:10,padding:10}}>
            <div style={{color:C.muted,fontSize:11,marginBottom:6}}>📍 سجّل كيلومتر اليوم (صوّر العداد في الفحص)</div>
            <div style={{display:"flex",gap:8}}>
              <input value={kmToday} onChange={e=>setKmToday(e.target.value)} type="number" placeholder="مثال: 285500"
                style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"8px 12px",color:C.text,fontSize:13,fontFamily:"inherit"}}/>
              <button onClick={()=>{if(kmToday)setKmToday("");}} style={{background:C.blue,color:"#fff",border:"none",borderRadius:10,padding:"8px 14px",fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>حفظ</button>
            </div>
          </div>
          {oilRemKm<500&&<div style={{background:C.danger+"12",border:`1px solid ${C.danger}33`,borderRadius:8,padding:"6px 10px",marginTop:8,fontSize:11,color:C.danger}}>🚨 يجب تغيير الزيت خلال {fmt(oilRemKm)} كم</div>}
        </div>

        {/* سائل التبريد */}
        <div style={{background:C.card,border:`1px solid ${vitals.coolantLevel<70?C.danger+"66":C.border}`,borderRadius:16,padding:16,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <div style={{width:40,height:40,borderRadius:12,background:C.blue+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>💧</div>
              <div><div style={{color:C.text,fontWeight:700,fontSize:14}}>سائل التبريد</div><div style={{color:C.muted,fontSize:11}}>مستوى الخزان</div></div>
            </div>
            <Pill color={vitals.coolantLevel<70?C.danger:vitals.coolantLevel<85?C.gold:C.success} small>{vitals.coolantLevel}%</Pill>
          </div>
          <div style={{background:C.border,borderRadius:99,height:8}}>
            <div style={{width:`${vitals.coolantLevel}%`,height:"100%",background:vitals.coolantLevel<70?C.danger:vitals.coolantLevel<85?C.gold:C.blue,borderRadius:99}}/>
          </div>
          {vitals.coolantLevel<70&&<div style={{background:C.danger+"12",borderRadius:8,padding:"5px 10px",marginTop:8,fontSize:11,color:C.danger}}>⚠️ مستوى منخفض — أضف سائل تبريد</div>}
        </div>

        {/* البطارية */}
        <div style={{background:C.card,border:`1px solid ${vitals.batteryHealth<70?C.danger+"66":C.border}`,borderRadius:16,padding:16,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <div style={{width:40,height:40,borderRadius:12,background:C.green+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🔋</div>
              <div><div style={{color:C.text,fontWeight:700,fontSize:14}}>البطارية</div><div style={{color:C.muted,fontSize:11}}>آخر تغيير: {vitals.batteryLastChange}</div></div>
            </div>
            <Pill color={vitals.batteryHealth<70?C.danger:vitals.batteryHealth<85?C.gold:C.success} small>{vitals.batteryHealth}%</Pill>
          </div>
          <div style={{background:C.border,borderRadius:99,height:8}}>
            <div style={{width:`${vitals.batteryHealth}%`,height:"100%",background:vitals.batteryHealth<70?C.danger:vitals.batteryHealth<85?C.gold:C.green,borderRadius:99}}/>
          </div>
          {vitals.batteryHealth<70&&<div style={{background:C.danger+"12",borderRadius:8,padding:"5px 10px",marginTop:8,fontSize:11,color:C.danger}}>⚠️ صحة البطارية ضعيفة — يُنصح بالتغيير</div>}
        </div>

        {/* الفرامل */}
        <div style={{background:C.card,border:`1px solid ${vitals.brakeFluid<75?C.gold+"66":C.border}`,borderRadius:16,padding:16,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <div style={{width:40,height:40,borderRadius:12,background:C.danger+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🛑</div>
              <div><div style={{color:C.text,fontWeight:700,fontSize:14}}>سائل الفرامل</div><div style={{color:C.muted,fontSize:11}}>مستوى السائل</div></div>
            </div>
            <Pill color={vitals.brakeFluid<75?C.gold:C.success} small>{vitals.brakeFluid}%</Pill>
          </div>
          <div style={{background:C.border,borderRadius:99,height:8}}>
            <div style={{width:`${vitals.brakeFluid}%`,height:"100%",background:vitals.brakeFluid<75?C.gold:C.success,borderRadius:99}}/>
          </div>
        </div>

        {/* الكفرات */}
        <div style={{color:C.text,fontWeight:800,fontSize:15,marginBottom:12,marginTop:4}}>⚙️ الكفرات</div>
        {myTires.map(t=>{
          const r=remDays(t),p=usedPct(t),s=tireStatus(t),color=sc(s),wl=t.warranty-t.wUsed;
          return <div key={t.id} style={{background:C.card,border:`1.5px solid ${s==="danger"?C.danger+"88":s==="warning"?C.gold+"66":C.border}`,borderRadius:14,padding:14,marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}><div style={{width:8,height:8,borderRadius:"50%",background:t.axleColor}}/><span style={{color:C.text,fontWeight:700,fontSize:13}}>{t.axle}</span></div>
                <div style={{color:C.muted,fontSize:11,marginTop:2}}>{t.brand} {t.origin} • {t.size}</div>
                <div style={{color:C.teal,fontSize:10,fontFamily:"monospace",marginTop:1}}>🔢 {t.serial}</div>
                <div style={{color:C.dim,fontSize:10,marginTop:1}}>{t.pressure} PSI | ضمان: {wl>0?wl+" شهر":"انتهى"}</div>
              </div>
              <Pill color={color} small>{r<0?"انتهى!":r<30?r+"ي":"✓ جيد"}</Pill>
            </div>
            <div style={{background:C.border,borderRadius:99,height:7,position:"relative",overflow:"hidden"}}>
              <div style={{position:"absolute",left:0,top:0,width:`${p}%`,height:"100%",background:`linear-gradient(90deg,${color}77,${color})`,borderRadius:99}}/>
              <div style={{position:"absolute",left:"85%",top:0,width:2,height:"100%",background:C.gold+"88"}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}><span style={{color:C.muted,fontSize:9}}>مستهلك: {p}%</span><span style={{color:color,fontWeight:700,fontSize:9}}>متبقي: {Math.max(r,0)} يوم</span></div>
          </div>;
        })}
        <button onClick={()=>setModal("ai")} style={{width:"100%",background:C.purple+"18",border:`1px solid ${C.purple}33`,borderRadius:12,padding:"10px",color:C.purple,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginTop:4}}>📸 صوّر كفر أو عطل وحلّله بالذكاء الاصطناعي</button>
      </div>}

      {/* ── INVOICES / RECORDS ── */}
      {tab==="invoices"&&<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{color:C.text,fontWeight:800,fontSize:16}}>📄 السجلات والفواتير</div>
          <Btn small color={C.gold} onClick={()=>setShowAdd(!showAdd)}>+ إضافة</Btn>
        </div>

        {/* Add form */}
        {showAdd&&<div style={{background:C.card,border:`1px solid ${C.gold}44`,borderRadius:16,padding:16,marginBottom:16}}>
          <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
            {[{v:"tire",l:"⚙️ كفر",c:C.teal},{v:"oil",l:"🛢️ زيت",c:C.orange},{v:"battery",l:"🔋 بطارية",c:C.green},{v:"maintenance",l:"🔧 صيانة",c:C.blue}].map(({v,l,c})=>(
              <button key={v} onClick={()=>setAddCategory(v)} style={{background:addCategory===v?c:C.card2,color:addCategory===v?"#fff":C.dim,border:`1px solid ${addCategory===v?c:C.border}`,borderRadius:20,padding:"5px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{l}</button>
            ))}
          </div>

          {addCategory==="tire"&&<>
            <div style={{background:C.teal+"12",border:`1px solid ${C.teal}33`,borderRadius:10,padding:10,marginBottom:12}}>
              <div style={{color:C.teal,fontWeight:700,fontSize:12,marginBottom:3}}>💡 الرقم التسلسلي يحفظ حقك في التعويض</div>
            </div>
            <Inp label="🔢 الرقم التسلسلي (إلزامي)" value={newItem.serial} onChange={v=>setNI("serial",v)} placeholder="BR-2025-XXX-0001"/>
            <Sel label="الماركة" value={newItem.brand} onChange={v=>setNI("brand",v)} options={["Bridgestone","Yokohama","Hankook","Triangle","Doublestar","Michelin","أخرى"]}/>
            <Sel label="المقاس" value={newItem.size} onChange={v=>setNI("size",v)} options={["11R22.5","12R22.5","295/80R22.5","315/80R22.5","385/65R22.5"]}/>
            <Sel label="المحور" value={newItem.axle} onChange={v=>setNI("axle",v)} options={["أمامي توجيه","خلفي محرك أيمن","خلفي محرك أيسر","خلفي تابع"]}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <Inp label="التكلفة (ريال)" value={newItem.cost} onChange={v=>setNI("cost",v)} type="number"/>
              <Inp label="الضمان (شهر)" value={newItem.warranty} onChange={v=>setNI("warranty",v)} type="number"/>
            </div>
          </>}

          {addCategory==="oil"&&<>
            <Inp label="كيلومتر التغيير" value={newItem.km} onChange={v=>setNI("km",v)} type="number" placeholder="285000"/>
            <Inp label="نوع الزيت (اختياري)" value={newItem.desc} onChange={v=>setNI("desc",v)} placeholder="مثال: 15W-40 فول سينثتيك"/>
            <Inp label="التكلفة (ريال)" value={newItem.cost} onChange={v=>setNI("cost",v)} type="number"/>
          </>}

          {addCategory==="battery"&&<>
            <Inp label="نوع البطارية (اختياري)" value={newItem.desc} onChange={v=>setNI("desc",v)} placeholder="مثال: Varta 180Ah"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <Inp label="التكلفة (ريال)" value={newItem.cost} onChange={v=>setNI("cost",v)} type="number"/>
              <Inp label="الضمان (شهر)" value={newItem.warranty} onChange={v=>setNI("warranty",v)} type="number"/>
            </div>
          </>}

          {addCategory==="maintenance"&&<>
            <Inp label="وصف الصيانة" value={newItem.desc} onChange={v=>setNI("desc",v)} placeholder="مثال: تغيير فلاتر الهواء"/>
            <Inp label="التكلفة (ريال)" value={newItem.cost} onChange={v=>setNI("cost",v)} type="number"/>
          </>}

          <Inp label="البائع / الورشة" value={newItem.seller} onChange={v=>setNI("seller",v)} placeholder="اسم البائع أو الورشة"/>

          {/* صورة الفاتورة */}
          <input ref={invPhotoRef} type="file" accept="image/*" capture="environment" onChange={onInvPhoto} style={{display:"none"}}/>
          {invPhoto
            ?<div style={{position:"relative",marginBottom:14}}>
               <img src={invPhoto.preview} alt="" style={{width:"100%",height:160,objectFit:"cover",borderRadius:12}}/>
               <div style={{position:"absolute",top:8,right:8,background:C.success,borderRadius:20,padding:"3px 10px",fontSize:11,color:"#fff",fontWeight:700}}>✓ فاتورة مصوّرة</div>
               <button onClick={()=>setInvPhoto(null)} style={{position:"absolute",top:8,left:8,background:"rgba(0,0,0,.7)",border:"none",borderRadius:20,padding:"4px 10px",color:"#fff",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>✕ حذف</button>
             </div>
            :<div onClick={()=>invPhotoRef.current.click()} style={{background:C.card2,border:`2px dashed ${C.gold}55`,borderRadius:12,padding:18,textAlign:"center",marginBottom:14,cursor:"pointer"}}>
               <div style={{fontSize:28,marginBottom:4}}>📷</div>
               <div style={{color:C.gold,fontSize:13,fontWeight:600}}>صوّر الفاتورة الأصلية</div>
               <div style={{color:C.muted,fontSize:11,marginTop:2}}>تُرسل لصاحب الأسطول للتحقق</div>
             </div>}

          <Btn full color={C.gold} onClick={saveItem}>حفظ وإنشاء الفاتورة ✓</Btn>
        </div>}

        {/* Tire records */}
        {tireInvoices.length>0&&<>
          <div style={{color:C.teal,fontWeight:700,fontSize:13,marginBottom:8}}>⚙️ الكفرات</div>
          {tireInvoices.map(inv=>(
            <div key={inv.id} style={{background:C.card,border:`1px solid ${C.teal}33`,borderRadius:12,padding:12,marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <div><div style={{color:C.text,fontWeight:700,fontSize:13}}>{inv.desc}</div><div style={{color:C.muted,fontSize:11}}>{inv.date} • {inv.seller||"—"}</div>{inv.serial&&<div style={{color:C.teal,fontSize:10,fontFamily:"monospace",marginTop:2}}>🔢 {inv.serial}</div>}</div>

        {invoices.length>0&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:12,marginTop:8}}>

      </div>}

      {tab==="profile"&&<div>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:18,padding:20,marginBottom:14,textAlign:"center"}}>

          <div style={{color:C.muted,fontSize:13}}>{user.truckBrand} {user.truckType} • {user.truck}</div>

        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,marginBottom:14}}>

            <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}><span style={{color:C.muted,fontSize:13}}>{l}</span><span style={{color:C.text,fontWeight:600,fontSize:13}}>{v}</span></div>

    </div>

      systemPrompt={`${AI_MECHANIC}\nأنت تساعد السائق ${user.name} الذي يقود ${user.truckBrand||""} ${user.truckType||""}.\nإذا أُرسلت صورة حللها فوراً وأعطِ تشخيصاً دقيقاً.`}

      onClose={()=>setModal(null)} user={user}/>}
  </div>;
}

    <BottomNav tabs={tabs} active={tab} onChange={setTab} color={C.gold}/>

    {modal==="ai_account"&&<AIChat title="المحاسب الذكي" icon="💰" color={C.green}
      systemPrompt={`${AI_ACCOUNTANT}\nأنت محاسب ${user.name} صاحب ${user.company}.\nعدد الشاحنات: ${drivers.length}\nإجمالي تكاليف الصيانة السنوية: ${fmt(totalCost)} ريال\nمتوسط التكلفة لكل شاحنة: ${fmt(Math.round(totalCost/Math.max(drivers.length,1)))} ريال\nالفواتير المسجلة: ${invoices.length}\nإجمالي الفواتير: ${fmt(invoices.reduce((a,b)=>a+b.total,0))} ريال`}

  </div>;
}

function SuperApp({user,onLogout}){
  const[tab,setTab]=useState("home");
  const[modal,setModal]=useState(null);
  const[selFleet,setSelFleet]=useState(null);

  const allOwners=USERS.filter(u=>u.role==="owner");
  const allFleetDrivers=Object.values(FLEETS_DATA).flatMap(f=>f.drivers);
  const allInvoices=Object.values(FLEETS_DATA).flatMap(f=>f.invoices);

  // حساب الإيرادات
  const monthlyRevenue=allOwners.reduce((a,o)=>a+(o.truckCount||1)*(o.pricePerTruck||99),0);
  const paidSubs=SUBSCRIPTION_INVOICES.filter(s=>s.paid);
  const unpaidSubs=SUBSCRIPTION_INVOICES.filter(s=>!s.paid);
  const totalCollected=paidSubs.reduce((a,s)=>a+s.total,0);
  const totalPending=unpaidSubs.reduce((a,s)=>a+s.total,0);
  const totalTrucks=allOwners.reduce((a,o)=>a+(o.truckCount||1),0);
  const totalUrgent=allFleetDrivers.reduce((a,d)=>a+d.tires.filter(t=>t.s==="danger").length+d.maintenance.filter(m=>m.s==="danger").length,0);

  const tabs=[
    {id:"home",icon:"📊",label:"الرئيسية"},
    {id:"fleets",icon:"🏢",label:"الأساطيل"},
    {id:"subs",icon:"💳",label:"الاشتراكات"},
    {id:"drivers",icon:"🚛",label:"السواقون"},
    {id:"pricing",icon:"💰",label:"الأسعار"},
  ];

  // ── Fleet Detail ──
  if(selFleet){
    const fd=FLEETS_DATA[selFleet.id];
    const drivers=fd?.drivers||[];
    const fleetInvoices=fd?.invoices||[];
    const fleetSubs=SUBSCRIPTION_INVOICES.filter(s=>s.ownerId===selFleet.id);
    const totalPaid=fleetSubs.filter(s=>s.paid).reduce((a,s)=>a+s.total,0);
    const monthlyFee=(selFleet.truckCount||1)*(selFleet.pricePerTruck||99);
    const urgent=drivers.reduce((a,d)=>a+d.tires.filter(t=>t.s==="danger").length+d.maintenance.filter(m=>m.s==="danger").length,0);

    return <div style={{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:"'Tajawal',sans-serif",direction:"rtl",maxWidth:480,margin:"0 auto"}}>
      <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,background:C.card,position:"sticky",top:0,zIndex:50,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <button onClick={()=>setSelFleet(null)} style={{background:"none",border:"none",color:C.dim,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← رجوع</button>
        <div style={{color:C.purple,fontWeight:900,fontSize:14}}>{selFleet.company}</div>
        <a href={`tel:${selFleet.phone}`} style={{color:C.blue,fontSize:20,textDecoration:"none"}}>📞</a>
      </div>
      <div style={{padding:14,paddingBottom:30,overflowY:"auto"}}>

        {/* Fleet hero */}
        <div style={{background:`linear-gradient(135deg,${C.purple}15,${C.card2})`,border:`1px solid ${C.purple}44`,borderRadius:18,padding:20,marginBottom:16,textAlign:"center"}}>
          <div style={{fontSize:44,marginBottom:8}}>{selFleet.avatar}</div>
          <div style={{color:C.text,fontWeight:900,fontSize:18}}>{selFleet.company}</div>
          <div style={{color:C.muted,fontSize:13}}>{selFleet.name} • {selFleet.city}</div>
          <div style={{color:C.teal,fontSize:11,fontFamily:"monospace",marginTop:4}}>🔑 {selFleet.fleetCode}</div>
          <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:10}}>
            <Pill color={selFleet.status==="active"?C.success:C.danger}>{selFleet.status==="active"?"نشط":"موقوف"}</Pill>
            <Pill color={C.gold}>انضم: {selFleet.joinDate}</Pill>
          </div>
        </div>

        {/* Subscription info */}
        <div style={{background:C.card,border:`1.5px solid ${C.gold}44`,borderRadius:16,padding:16,marginBottom:14}}>
          <div style={{color:C.gold,fontWeight:800,fontSize:14,marginBottom:12}}>💳 تفاصيل الاشتراك</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            {[
              {l:"عدد الشاحنات",v:selFleet.truckCount+" شاحنة",c:C.blue},
              {l:"السعر/شاحنة",v:fmt(selFleet.pricePerTruck)+" ر",c:C.teal},
              {l:"الاشتراك الشهري",v:fmt(monthlyFee)+" ر",c:C.gold},
              {l:"الاشتراك السنوي",v:fmt(monthlyFee*12)+" ر",c:C.purple},
            ].map(({l,v,c})=>(
              <div key={l} style={{background:C.card2,borderRadius:10,padding:10,textAlign:"center"}}>
                <div style={{color:c,fontWeight:800,fontSize:14}}>{v}</div>
                <div style={{color:C.muted,fontSize:10,marginTop:2}}>{l}</div>
              </div>

          </div>
          {/* Payment history */}
          <div style={{color:C.text,fontWeight:700,fontSize:13,marginBottom:8}}>سجل المدفوعات</div>

            <span style={{color:C.text,fontWeight:700}}>إجمالي المحصّل</span>
            <span style={{color:C.success,fontWeight:900,fontSize:16}}>{fmt(totalPaid)} ر</span>

        </div>

        {/* Fleet stats */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          {[
            {l:"السواقون",v:drivers.length+" سائق",c:C.blue,i:"🚛"},
            {l:"تنبيهات عاجلة",v:urgent,c:urgent>0?C.danger:C.success,i:"🚨"},
            {l:"الفواتير المسجلة",v:fleetInvoices.length,c:C.orange,i:"📄"},
            {l:"إجمالي فواتير الصيانة",v:fmt(fleetInvoices.reduce((a,b)=>a+b.total,0))+" ر",c:C.teal,i:"💰"},

            <div key={l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:12}}>

              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:18}}>{d.avatar}</span>
                <div>
                  <div style={{color:C.text,fontWeight:700,fontSize:13}}>{d.name}</div>
                  <div style={{color:C.muted,fontSize:11}}>{d.truck} • {d.brand}</div>

                {driverUrgent>0&&<Pill color={C.danger} small>🚨{driverUrgent}</Pill>}

                <Pill color={d.checkScore===100?C.success:C.gold} small>{d.checkScore}%</Pill>

        <button onClick={onLogout} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:20,padding:"5px 10px",color:C.dim,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>خروج</button>

            <div style={{color:C.purple,fontWeight:900,fontSize:15}}>محلل TBR Pro الذكي</div>
            <div style={{color:C.dim,fontSize:12,marginTop:3}}>يحلل بيانات الأساطيل • يصنف السواقين • يتنبأ بالتكاليف</div>

          <span style={{color:C.purple,fontSize:20}}>←</span>
        </div>

        {/* Revenue summary */}
        <div style={{background:`linear-gradient(135deg,${C.purple}15,${C.card2})`,border:`1px solid ${C.purple}44`,borderRadius:18,padding:20}}>

          <div style={{color:C.purple,fontWeight:900,fontSize:32}}>{fmt(monthlyRevenue)} ر</div>
          <div style={{display:"flex",gap:20,marginTop:14}}>
            {[
              {l:"الأساطيل",v:allOwners.length,c:C.gold},
              {l:"الشاحنات",v:totalTrucks,c:C.blue},
              {l:"السواقون",v:allFleetDrivers.length,c:C.teal},

              <div key={l} style={{textAlign:"center"}}>
                <div style={{color:c,fontWeight:900,fontSize:22}}>{v}</div>

          </div>

          ].map(({icon,l,v,c})=>(
            <div key={l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14}}>

          const notChecked=drivers.filter(d=>d.lastCheckDate!==todayStr()).length;

                <span style={{color:C.gold,fontWeight:700,fontSize:13}}>💳 الاشتراك</span>
                <span style={{color:C.gold,fontWeight:900,fontSize:16}}>{fmt(monthlyFee)} ر/شهر</span>

            {l:"إجمالي سنوي",v:fmt(monthlyRevenue*12)+" ر",c:C.gold,i:"📈"},
            {l:"مبالغ محصّلة",v:fmt(totalCollected)+" ر",c:C.success,i:"✅"},
            {l:"مبالغ معلقة",v:fmt(totalPending)+" ر",c:totalPending>0?C.danger:C.success,i:"⚠️"},

                <div style={{color:C.blue,fontWeight:700,fontSize:12}}>{fmt(d.mileage)} كم</div>

              <div style={{textAlign:"left"}}>
                <div style={{color:tier.color,fontWeight:900,fontSize:24}}>{fmt(tier.price)} ر</div>

            </div>
          </div>

        <div style={{background:C.card,border:`1px solid ${C.purple}44`,borderRadius:16,padding:16,marginTop:4}}>

          ))}
        </div>
      </div>}

    </div>

    <BottomNav tabs={tabs} active={tab} onChange={setTab} color={C.purple}/>
    {modal==="ai"&&<AIChat title="محلل TBR Pro الذكي" icon="👑" color={C.purple}
      systemPrompt={`${AI_SUPER}

بيانات المنصة:
📊 ${allOwners.length} أساطيل | ${allFleetDrivers.length} سائق
💰 إيرادات شهرية: ${fmt(monthlyRevenue)} ريال | سنوية: ${fmt(monthlyRevenue*12)} ريال
✅ محصّل: ${fmt(totalCollected)} ريال | ⚠️ معلق: ${fmt(totalPending)} ريال
🚛 إجمالي الشاحنات: ${totalTrucks}

الأساطيل:
${allOwners.map(o=>`• ${o.company}: ${o.truckCount} شاحنة × ${fmt(o.pricePerTruck)} ر = ${fmt((o.truckCount||1)*(o.pricePerTruck||99))} ر/شهر`).join('\n')}

إذا أُرسلت بيانات حللها فوراً.`}
      suggestions={["حلّل أداء الأساطيل","أي الأساطيل الأعلى ربحية؟","توقع الإيرادات لنهاية السنة","كيف أجذب عملاء جدد؟"]}
      onClose={()=>setModal(null)} user={user}/>}
  </div>;
}

// ── AUTH ─────────────────────────────────────────────────────────
function Auth({mode,onBack,onSuccess}){
  const[roleChoice,setRoleChoice]=useState(null);
  const[form,setForm]=useState({email:"",password:"",name:"",company:"",city:"",truck:"",truckBrand:"Mercedes",truckType:"شاحنة نقل ثقيل",fleetCode:"",licenseExpiry:"2026-12-01"});
  const[step,setStep]=useState(1);
  const[error,setError]=useState("");
  const[loading,setLoading]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const isLogin=mode==="login";

  const submit=()=>{
    setLoading(true);setError("");
    setTimeout(()=>{
      if(isLogin){
        const u=USERS.find(u=>u.email===form.email&&u.password===form.password);
        if(u)onSuccess(u);else setError("بيانات الدخول غلط");
      }else{
        if(roleChoice==="driver"){
          const validCodes=[FLEET_CODE_1.toUpperCase(),FLEET_CODE_2.toUpperCase()];
          if(!validCodes.includes(form.fleetCode.trim().toUpperCase())){setError("كود الأسطول غير صحيح");setLoading(false);return;}
        }
        const owner=USERS.find(u=>u.role==="owner"&&u.fleetCode?.toUpperCase()===form.fleetCode?.trim().toUpperCase());
        onSuccess({...form,id:Date.now().toString(),role:roleChoice,avatar:roleChoice==="driver"?"🚛":"👤",plan:"pro",monthlyFee:699,ownerName:owner?.name||"صاحب الأسطول",ownerId:owner?.id,joinDate:todayStr()});
      }
      setLoading(false);
    },700);
  };

  if(!isLogin&&!roleChoice) return <div style={{padding:"20px"}}>
    <button onClick={onBack} style={{background:"none",border:"none",color:C.dim,fontSize:13,cursor:"pointer",fontFamily:"inherit",marginBottom:24}}>← رجوع</button>
    <div style={{fontSize:36,textAlign:"center",marginBottom:10}}>✨</div>
    <div style={{color:C.gold,fontWeight:900,fontSize:22,textAlign:"center",marginBottom:28}}>أنت من؟</div>
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {[{role:"owner",icon:"👤",title:"صاحب أسطول",desc:"أدر أسطولك وسواقينك\nميكانيكي + محاسب + مستشار AI",color:C.gold},{role:"driver",icon:"🚛",title:"سائق",desc:"فحص يومي بالصور • طوارئ\nميكانيكي AI • سجل الشاحنة",color:C.blue}].map(({role,icon,title,desc,color})=>(
        <div key={role} onClick={()=>setRoleChoice(role)} style={{background:C.card,border:`2px solid ${color}44`,borderRadius:20,padding:24,cursor:"pointer",textAlign:"center"}}
          onMouseEnter={e=>e.currentTarget.style.borderColor=color} onMouseLeave={e=>e.currentTarget.style.borderColor=color+"44"}>
          <div style={{fontSize:48,marginBottom:10}}>{icon}</div>
          <div style={{color,fontWeight:900,fontSize:18,marginBottom:6}}>{title}</div>
          <div style={{color:C.dim,fontSize:13,lineHeight:1.7,whiteSpace:"pre-line"}}>{desc}</div>
        </div>
      ))}
    </div>
  </div>;

  const steps=roleChoice==="driver"?["معلوماتك","شاحنتك","الحساب"]:["معلوماتك","الحساب"];

  return <div style={{padding:"20px",minHeight:"100vh",overflowY:"auto"}}>
    <button onClick={()=>{if(!isLogin&&step>1)setStep(s=>s-1);else if(!isLogin&&roleChoice)setRoleChoice(null);else onBack();}} style={{background:"none",border:"none",color:C.dim,fontSize:13,cursor:"pointer",fontFamily:"inherit",marginBottom:20}}>← رجوع</button>
    {!isLogin&&<div style={{display:"flex",gap:4,marginBottom:20}}>{steps.map((s,i)=>(<div key={i} style={{flex:1,textAlign:"center"}}><div style={{height:4,borderRadius:2,background:i+1<=step?C.gold:C.border,marginBottom:3}}/><span style={{color:i+1<=step?C.gold:C.muted,fontSize:10,fontWeight:700}}>{s}</span></div>))}</div>}
    <div style={{fontSize:32,textAlign:"center",marginBottom:8}}>{isLogin?"🔐":roleChoice==="driver"?"🚛":"👤"}</div>
    <div style={{color:C.gold,fontWeight:900,fontSize:20,textAlign:"center",marginBottom:20}}>{isLogin?"تسجيل الدخول":roleChoice==="owner"?"حساب صاحب أسطول":"حساب سائق"}</div>

    {!isLogin&&step===1&&<>
      <Inp label="الاسم الكامل" value={form.name} onChange={v=>set("name",v)} placeholder="اسمك الكامل"/>
      {roleChoice==="owner"&&<><Inp label="اسم الشركة" value={form.company} onChange={v=>set("company",v)} placeholder="شركة ... للنقل"/><Inp label="المدينة" value={form.city} onChange={v=>set("city",v)} placeholder="الدمام"/></>}
      {roleChoice==="driver"&&<><div style={{background:C.blue+"12",border:`1px solid ${C.blue}33`,borderRadius:12,padding:12,marginBottom:14}}><div style={{color:C.blue,fontWeight:700,fontSize:13,marginBottom:4}}>🔑 كود انضمام الأسطول</div><div style={{color:C.dim,fontSize:12}}>اطلب الكود من صاحب الأسطول</div></div><Inp label="كود الأسطول" value={form.fleetCode} onChange={v=>set("fleetCode",v)} placeholder="مثال: DESERT-2025"/></>}
      <Btn full onClick={()=>setStep(2)}>التالي ←</Btn>
    </>}

    {!isLogin&&roleChoice==="driver"&&step===2&&<>
      <Inp label="رقم الشاحنة" value={form.truck} onChange={v=>set("truck",v)} placeholder="أ ب ج 1234"/>
      <Sel label="ماركة الشاحنة" value={form.truckBrand} onChange={v=>set("truckBrand",v)} options={["Mercedes","Volvo","Scania","MAN","DAF","Hino","Isuzu","أخرى"]}/>
      <Sel label="نوع المركبة" value={form.truckType} onChange={v=>set("truckType",v)} options={["شاحنة نقل ثقيل","قاطرة","خلاطة خرسانة","رافعة شوك","صهريج","دمبر","معدة بناء"]}/>
      <Inp label="تاريخ انتهاء الرخصة" value={form.licenseExpiry} onChange={v=>set("licenseExpiry",v)} type="date"/>
      <Btn full onClick={()=>setStep(3)}>التالي ←</Btn>
    </>}

    {(isLogin||(roleChoice==="owner"&&step===2)||(roleChoice==="driver"&&step===3))&&<>
      <Inp label="البريد الإلكتروني" value={form.email} onChange={v=>set("email",v)} type="email" placeholder="name@fleet.sa"/>
      <Inp label="كلمة المرور" value={form.password} onChange={v=>set("password",v)} type="password" placeholder="••••••••"/>
      {error&&<div style={{background:C.danger+"18",borderRadius:10,padding:"10px 14px",color:C.danger,fontSize:13,marginBottom:14}}>{error}</div>}
      <Btn full onClick={submit} disabled={loading}>{loading?"...":isLogin?"دخول":"إنشاء الحساب 🚀"}</Btn>
      {isLogin&&<div style={{background:C.gold+"12",border:`1px solid ${C.gold}33`,borderRadius:12,padding:12,marginTop:16}}>
        <div style={{color:C.gold,fontWeight:700,fontSize:12,marginBottom:8}}>🔑 اضغط للاختيار السريع</div>
        {[{r:"👑 مصطفى (Super Admin)",e:"mustafa@tbrpro.sa",p:"admin2025"},{r:"👤 مصطفى العمري (أسطول 1)",e:"mustafa@desert.sa",p:"123456"},{r:"👤 إبراهيم (أسطول 2)",e:"ibrahim@gulf.sa",p:"123456"},{r:"🚛 أحمد الغامدي",e:"ahmed@fleet.sa",p:"123456"},{r:"🚛 خالد المطيري",e:"khalid@fleet.sa",p:"123456"},{r:"🚛 سالم العتيبي",e:"salem@fleet.sa",p:"123456"},{r:"🚛 ناصر الشمري",e:"nasser@gulf.sa",p:"123456"}].map(({r,e,p})=>(
          <div key={e} onClick={()=>{set("email",e);set("password",p);}} style={{padding:"6px 0",cursor:"pointer",borderBottom:`1px solid ${C.gold}22`}}>
            <span style={{color:C.text,fontSize:12,fontWeight:700}}>{r}: </span><span style={{color:C.dim,fontSize:11}}>{e}</span>
          </div>
        ))}
      </div>}
    </>}
  </div>;
}

// ── LANDING ──────────────────────────────────────────────────────
function Landing({onLogin,onRegister}){
  return <div>
    <div style={{padding:"36px 24px 20px",textAlign:"center",position:"relative"}}>
      <div style={{position:"absolute",inset:0,background:`radial-gradient(ellipse at 50% 0%,${C.gold}12,transparent 60%)`,pointerEvents:"none"}}/>
      <div style={{fontSize:50,marginBottom:10}}>🚛</div>
      <div style={{color:C.gold,fontWeight:900,fontSize:28,marginBottom:6}}>TBR Pro</div>
      <div style={{color:C.text,fontWeight:700,fontSize:15,marginBottom:8}}>إدارة الأسطول والكفرات بذكاء</div>
      <div style={{color:C.dim,fontSize:12,lineHeight:1.8,marginBottom:24}}>صاحب الأسطول • السائق • كل شيء في تطبيق واحد</div>
      <div style={{display:"flex",flexDirection:"column",gap:10,maxWidth:300,margin:"0 auto"}}>
        <Btn full onClick={onRegister}>ابدأ مجاناً 🚀</Btn>
        <Btn full outline color={C.dim} onClick={onLogin}>تسجيل الدخول</Btn>
      </div>
    </div>
    <div style={{padding:"0 16px 32px"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
        {[{icon:"👤",title:"صاحب الأسطول",desc:"• تابع فحص السائقين بالصور\n• ميكانيكي + محاسب + مستشار AI\n• مؤشرات بصرية للكفرات\n• تكاليف وتقارير مفصلة",color:C.gold},{icon:"🚛",title:"السائق",desc:"• فحص يومي بصور إلزامية\n• زيت • بطارية • تبريد\n• ميكانيكي AI يحلل صورك\n• سجل كامل للشاحنة",color:C.blue}].map(({icon,title,desc,color})=>(
          <div key={title} style={{background:C.card,border:`1.5px solid ${color}44`,borderRadius:16,padding:16}}>
            <div style={{fontSize:28,marginBottom:8}}>{icon}</div>
            <div style={{color,fontWeight:800,fontSize:14,marginBottom:6}}>{title}</div>
            <div style={{color:C.dim,fontSize:11,lineHeight:1.7,whiteSpace:"pre-line"}}>{desc}</div>
          </div>
        ))}
      </div>
    </div>
  </div>;
}

// ── MAIN ─────────────────────────────────────────────────────────
export default function App(){
  const[screen,setScreen]=useState("landing");
  const[user,setUser]=useState(null);
  const login=u=>{setUser(u);setScreen("app");};
  const logout=()=>{setUser(null);setScreen("landing");};

  return <div style={{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:"'Tajawal','Noto Sans',sans-serif",direction:"rtl",maxWidth:480,margin:"0 auto"}}>
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap');
      *{box-sizing:border-box;margin:0;padding:0;}
      select,input,textarea{outline:none;font-family:inherit;}
      ::-webkit-scrollbar{width:3px;} ::-webkit-scrollbar-thumb{background:#222;border-radius:2px;}
      @keyframes bounce{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}}
      a{text-decoration:none;}
    `}</style>
    {screen==="landing" && <Landing onLogin={()=>setScreen("login")} onRegister={()=>setScreen("register")}/>}
    {screen==="login" && <Auth mode="login" onBack={()=>setScreen("landing")} onSuccess={login}/>}
    {screen==="register" && <Auth mode="register" onBack={()=>setScreen("landing")} onSuccess={login}/>}
    {screen==="app" && user && (
      user.role==="super" ? <SuperApp user={user} onLogout={logout}/> :
      user.role==="owner" ? <OwnerApp user={user} onLogout={logout}/> :
      <DriverApp user={user} onLogout={logout}/>
    )}
  </div>;
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
